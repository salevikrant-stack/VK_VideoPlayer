<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Ultimate Video Player</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="topbar">

<h2>Ultimate Video Player</h2>

<button id="openBtn">Open Video</button>

</div>

<div class="player">

<video id="video" controls></video>

</div>

<div class="toolbar">

<label>

Quality

<select id="quality">

<option>Original</option>

<option>High</option>

<option>Medium</option>

<option>Low</option>

</select>

</label>

<label>

Resolution

<select id="resolution">

<option>Original</option>

<option>240p</option>

<option>360p</option>

<option>480p</option>

<option>720p</option>

<option>1080p</option>

<option>1440p</option>

<option>2160p</option>

</select>

</label>

<button id="convertBtn">

Convert

</button>

</div>

<script src="js/player.js"></script>

</body>

</html>
